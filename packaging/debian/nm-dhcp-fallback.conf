# Keep the station reachable on a show LAN with no DHCP server.
#
# Without this NetworkManager leaves the NIC with no IPv4 address at all: the
# web server is up and avahi is answering, but nothing can reach either.
#
# link-local=4 is "fallback", not 3 ("enabled"): the 169.254 address appears
# only where DHCP went unanswered, and goes away again when a lease arrives, so
# a healthy LAN never carries a second address. It is not gated on
# dhcp-timeout - NetworkManager assigns it within seconds of the first failed
# lease attempt, so a replug does pass through a link-local address on its way
# to the real lease.
#
# dhcp-timeout pins NetworkManager's own default, so the retry window cannot
# move under us if a distro ships a different one.
#
# Set as a connection *default* rather than on a profile so it also covers
# profiles created later, and so nothing has to rewrite operator config at
# runtime.
[connection]
ipv4.dhcp-timeout=45
ipv4.link-local=4
