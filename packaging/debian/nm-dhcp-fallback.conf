# Keep the station reachable on a show LAN with no DHCP server.
#
# Without this NetworkManager leaves the NIC with no IPv4 address at all: the
# web server is up and avahi is answering, but nothing can reach either.
#
# may-fail lets activation finish without a lease; dhcp-timeout bounds the wait
# (45s is NM's own default, chosen to clear spanning-tree convergence on a
# switch port without portfast - a shorter wait makes an ordinary cable replug
# churn through a link-local address before the real lease arrives).
#
# link-local=4 is "fallback", not 3 ("enabled"): the 169.254 address appears
# only once DHCP has given up and goes away again when a lease arrives, so a
# healthy LAN never carries a second address.
#
# Set as a connection *default* rather than on a profile so it also covers
# profiles created later, and so nothing has to rewrite operator config at
# runtime.
[connection]
ipv4.may-fail=true
ipv4.dhcp-timeout=45
ipv4.link-local=4
