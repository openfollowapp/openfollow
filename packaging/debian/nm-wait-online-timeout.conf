# Installed by the openfollow package as a drop-in for
# NetworkManager-wait-online.service.
#
# openfollow.service is ordered After=network-online.target so the app binds a
# real LAN address (not loopback) for its web UI, PSN beacon and discovery. The
# stock wait (nm-online -s, ~60s) waits for NetworkManager's startup to
# complete, which a DHCP profile with no server never reaches beside its
# link-local fallback: every boot on such a LAN held the kiosk behind the splash
# for the whole wait and then failed the unit. nm-wait-online.sh also accepts
# every activating device holding an IPv4 address, and caps the wait at 20s; the
# app does its own short (~10s) network-readiness wait once started.
[Service]
ExecStart=
ExecStart=/usr/share/openfollow/nm-wait-online.sh 20
